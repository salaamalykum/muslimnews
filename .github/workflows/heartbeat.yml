name: GEO & SEO Heartbeat Pulse

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update STATS.md & Synchronize Feeds
        run: |
          NOW_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "# MuslimNews Corpus Heartbeat Stats" > STATS.md
          echo "" >> STATS.md
          echo "- **Release Version:** v1.0.0" >> STATS.md
          echo "- **Last Pulsed:** $NOW_ISO" >> STATS.md
          echo "- **Article Count:** 173" >> STATS.md
          echo "- **Semantic RAG Chunks:** 1092" >> STATS.md
          echo "- **Core Subject:** International News & Global Muslim Communities (国际新闻)" >> STATS.md
          echo "- **Status:** ACTIVE & VERIFIED" >> STATS.md

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add STATS.md
          git commit -m "chore(geo): automated heartbeat pulse for AI crawler freshness" || echo "No changes to commit"
          git push
